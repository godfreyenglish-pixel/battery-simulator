<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rivertown Solar · Lead Tracker</title>
<style>
  :root{
    --navy:#0d1b33; --navy2:#152744; --gold:#a9812c; --gold2:#c69a3d;
    --bg:#f4f6f9; --card:#ffffff; --line:#e4e8ef; --ink:#1a2230; --mut:#6b7688;
    --good:#1f9d55; --good-bg:#e6f6ec; --bad:#c0392b; --bad-bg:#fdecea; --warn:#b7791f;
    --shadow:0 1px 3px rgba(13,27,51,.08),0 6px 18px rgba(13,27,51,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}

  /* Header */
  header.top{background:var(--navy);color:#fff}
  .top-in{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
  .brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;color:#1a1300;font-weight:800;font-size:14px}
  .brand small{display:block;font-weight:500;color:#9fb0cc;font-size:11px;letter-spacing:.3px}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .top-actions .status-pill{font-size:12px;color:#bcd0f0;display:flex;align-items:center;gap:6px}
  .top-actions .status-pill i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
  .btn{border:1px solid transparent;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;background:#e9edf3;color:var(--ink)}
  .btn:hover{filter:brightness(.98)}
  .btn.ghost{background:transparent;border-color:#33456a;color:#dfe7f5}
  .btn.ghost:hover{background:#1b2c4c}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.danger{background:var(--bad);color:#fff}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .btn:disabled{opacity:.6;cursor:not-allowed}

  /* Tabs */
  nav.tabs{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:none;padding:10px 14px;font-size:14px;font-weight:600;color:#9fb0cc;border-radius:9px 9px 0 0}
  nav.tabs button.active{background:var(--bg);color:var(--navy)}
  .tabsbar{background:var(--navy)}

  h2.sec{font-size:16px;margin:26px 2px 12px;letter-spacing:.2px}
  .muted{color:var(--mut)}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-top:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
  .kpi .sub{font-size:12px;color:var(--mut);margin-top:2px}

  .cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:760px){.cards2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:14px}

  /* Charts */
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar-row .bl{width:118px;flex:none;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{flex:1;background:#eef1f6;border-radius:6px;height:16px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--navy),#2c4576);border-radius:6px}
  .bar-row .bv{width:38px;text-align:right;font-weight:700;flex:none}

  /* Controls */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
  .controls input[type=text],.controls select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink)}
  .controls input[type=text]{min-width:200px;flex:1}
  .spacer{flex:1}

  /* Table */
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto}
  table{border-collapse:collapse;width:100%;min-width:720px}
  th,td{text-align:left;padding:11px 13px;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f8fafc;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
  tbody tr:hover{background:#fafbfd}
  td .who{font-weight:700}
  td .sub{color:var(--mut);font-size:12px}
  .rowbtns{display:flex;gap:6px}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;color:var(--ink)}
  .iconbtn:hover{background:#f2f5f9}
  .iconbtn.del:hover{background:var(--bad-bg);border-color:#f3b9b1;color:var(--bad)}

  /* status chips */
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px}
  .st-New{background:#eef2ff;color:#3b4cca}
  .st-Contacted{background:#fff4e5;color:#b7791f}
  .st-Proposal.Sent,.st-ProposalSent{background:#e8f0fe;color:#1a56db}
  .st-Contract.Signed,.st-ContractSigned{background:#e6f6ec;color:#1f7a44}
  .st-Permitted{background:#eafaf1;color:#1f9d55}
  .st-Installed{background:#e6f7f9;color:#0e7490}
  .st-PTO{background:#f3e8ff;color:#7e22ce}
  .st-Commission.Paid,.st-CommissionPaid{background:#e6f6ec;color:#0f5132}

  /* Forms */
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:680px){.formgrid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--mut)}
  .field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);width:100%}
  .field textarea{min-height:74px;resize:vertical}
  .field.calc input{background:#f6f8fb;font-weight:700}
  .form-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  /* Edit drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(13,27,51,.42);backdrop-filter:blur(1px);z-index:40;display:flex;justify-content:flex-end}
  .drawer{width:min(520px,100%);height:100%;background:var(--bg);overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);animation:slidein .18s ease}
  @keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
  .drawer-head{position:sticky;top:0;background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
  .drawer-head .x{margin-left:auto;background:transparent;border:none;color:#cdd8ec;font-size:22px;line-height:1;cursor:pointer}
  .drawer-body{padding:18px}

  /* Modal (delete / log) */
  .modal-bg{position:fixed;inset:0;background:rgba(13,27,51,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .16s ease}
  @keyframes pop{from{transform:scale(.96);opacity:.7}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.5}
  .modal .warnring{width:44px;height:44px;border-radius:50%;background:var(--bad-bg);color:var(--bad);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin-bottom:12px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}

  /* Toast */
  .toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:pop .16s ease}
  .toast.good{background:var(--good)}
  .toast.bad{background:var(--bad)}

  /* Connect screen */
  .connect{max-width:520px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 28px}
  .connect h1{font-size:20px;margin:14px 0 6px}
  .connect p{color:var(--mut);font-size:14px;line-height:1.55;margin:0 0 18px}
  .connect input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:12px}
  .connect .big-dot{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;color:#1a1300;font-weight:800;font-size:20px}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center}

  .empty{padding:44px 20px;text-align:center;color:var(--mut)}
  .spin{width:34px;height:34px;border:3px solid #dfe5ee;border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err-banner{background:var(--bad-bg);color:var(--bad);border:1px solid #f3b9b1;padding:12px 14px;border-radius:11px;font-size:13px;margin-top:14px;display:flex;gap:10px;align-items:center}
  .grid-mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px;margin-top:6px}
  .grid-mini div span{color:var(--mut)}
</style>
</head>

<div id="root"></div>

  /* ---------- helpers ---------- */
  const fmt$ = n => (isFinite(n)?n:0).toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
  const num = v => { const n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };
  const todayISO = () => new Date().toISOString().slice(0,10);
  const parseDate = s => { if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; };
  const daysBetween = (a,b) => { const da=parseDate(a),db=parseDate(b); if(!da||!db) return null; return Math.round((db-da)/86400000); };
  const stClass = s => "st-"+String(s||"").replace(/\s+/g,"");
  const monthKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  const monthLabel = key => { const [y,m]=key.split("-"); return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"short"}); };

  /* ---------- API (all Apps Script doGet actions; GET avoids CORS preflight) ---------- */
  function makeApi(baseUrl){
    const call = async (params) => {
      const u = new URL(baseUrl);
      Object.keys(params).forEach(k => u.searchParams.set(k, params[k]));
      const res = await fetch(u.toString(), { method:"GET", redirect:"follow" });
      if(!res.ok) throw new Error("HTTP "+res.status);
      const txt = await res.text();
      let data; try{ data = JSON.parse(txt); }catch(e){ data = txt; }
      // surface server-reported failures
      if(data && typeof data==="object" && (data.status==="error"||data.error) && !data.leads){
        throw new Error(data.message || data.error || "Server error");
      }
      return data;
    };
    const normalizeLeads = d => {
      let arr = Array.isArray(d) ? d : (d && (d.leads || d.data || d.rows)) || [];
      return arr.map(r => ({
        id:r.id||"", name:r.name||"", email:r.email||"", phone:r.phone||"",
        source:r.source||"", dateAdded:r.dateAdded||"", status:r.status||"New",
        systemSize:r.systemSize||"", dealValue:r.dealValue||"", commissionPct:r.commissionPct||"",
        commissionAmount:r.commissionAmount||"", dateClosed:r.dateClosed||"", dateInstalled:r.dateInstalled||"",
        datePTO:r.datePTO||"", dateCommissionPaid:r.dateCommissionPaid||"", notes:r.notes||""
      }));
    };
    return {
      get:    async () => normalizeLeads(await call({action:"get"})),
      add:    lead => call({action:"add",    data:JSON.stringify(lead)}),
      update: lead => call({action:"update", data:JSON.stringify(lead)}),
      remove: id   => call({action:"delete", id:id}),
      // send both the handler param names (kind/outcome/text) so notes never save blank
      log:    (id,kind,outcome,text) => call({action:"logInteraction", id:id, kind:kind, outcome:outcome, text:text})
    };
  }

  /* ---------- small components ---------- */
  function BarChart({rows}){
    const max = Math.max(1, ...rows.map(r=>r.value));
    if(!rows.length) return html`<div class="muted" style="font-size:13px">No data yet.</div>`;
    return html`<div>${rows.map(r=>html`
      <div class="bar-row" key=${r.label}>
        <div class="bl" title=${r.label}>${r.label}</div>
        <div class="bar-track"><div class="bar-fill" style=${{width:(r.value/max*100)+"%"}}></div></div>
        <div class="bv">${r.display!=null?r.display:r.value}</div>
      </div>`)}</div>`;
  }

  function Toasts({items}){
    return html`<div class="toasts">${items.map(t=>html`
      <div class=${"toast "+(t.type||"")} key=${t.id}>${t.type==="good"?"✓":t.type==="bad"?"!":"•"} ${t.msg}</div>`)}</div>`;
  }

  /* ---------- Connect screen ---------- */
  function Connect({onConnect}){
    const [val,setVal] = useState("");
    const [busy,setBusy] = useState(false);
    const [err,setErr] = useState("");
    const go = async () => {
      const u = val.trim();
      if(!/^https:\/\/script\.google\.com\/macros\//.test(u)){
        setErr("That doesn't look like a Web App URL. It should start with https://script.google.com/macros/…/exec");
        return;
      }
      setBusy(true); setErr("");
      try{
        const api = makeApi(u);
        await api.get(); // validate it responds
        onConnect(u);
      }catch(e){
        setErr("Couldn't reach that URL. Check the deployment is set to Anyone, then paste the /exec link again.");
      }finally{ setBusy(false); }
    };
    return html`
      <div class="connect center">
        <div class="big-dot">R</div>
        <h1>Rivertown Lead Tracker</h1>
        <p>Paste your Apps Script <b>Web App URL</b> (the <code>/exec</code> link) to connect to your Leads sheet.</p>
        <input placeholder="https://script.google.com/macros/s/…/exec" value=${val}
               onInput=${e=>setVal(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&go()} />
        <button class="btn gold" style="width:100%;padding:12px" disabled=${busy} onClick=${go}>
          ${busy?"Connecting…":"Connect to Sheet"}</button>
        ${err && html`<div class="err-banner" style="margin-top:14px">${err}</div>`}
      </div>`;
  }

  /* ---------- Lead form (add + edit) ---------- */
  function LeadForm({initial,onSubmit,onCancel,submitting,submitLabel}){
    const [f,setF] = useState(()=>Object.assign({
      id:"",name:"",email:"",phone:"",source:"Referral",dateAdded:todayISO(),status:"New",
      systemSize:"",dealValue:"",commissionPct:"",commissionAmount:"",dateClosed:"",dateInstalled:"",
      datePTO:"",dateCommissionPaid:"",notes:""
    },initial||{}));
    const set = (k,v) => setF(p=>{
      const n={...p,[k]:v};
      if(k==="dealValue"||k==="commissionPct"){ n.commissionAmount = Math.round(num(n.dealValue)*num(n.commissionPct)/100); }
      return n;
    });
    const F = (label,key,type="text",opts) => html`
      <div class="field ${key==="commissionAmount"?"calc":""}">
        <label>${label}</label>
        ${opts ? html`<select value=${f[key]} onChange=${e=>set(key,e.target.value)}>
              ${opts.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`
          : html`<input type=${type} value=${f[key]} readOnly=${key==="commissionAmount"}
                    onInput=${e=>set(key,e.target.value)} />`}
      </div>`;
    return html`
      <div>
        <div class="formgrid">
          ${F("Full name","name")}
          ${F("Email","email","email")}
          ${F("Phone","phone")}
          ${F("Source","source",null,SOURCES)}
          ${F("Date added","dateAdded","date")}
          ${F("Status","status",null,STATUSES)}
          ${F("System size (kW)","systemSize","number")}
          ${F("Deal value ($)","dealValue","number")}
          ${F("Commission %","commissionPct","number")}
          ${F("Commission amount ($)","commissionAmount")}
          ${F("Date closed","dateClosed","date")}
          ${F("Date installed","dateInstalled","date")}
          ${F("Date PTO","datePTO","date")}
          ${F("Date commission paid","dateCommissionPaid","date")}
        </div>
        <div class="field" style="margin-top:14px">
          <label>Notes</label>
          <textarea value=${f.notes} onInput=${e=>set("notes",e.target.value)}></textarea>
        </div>
        <div class="form-actions">
          <button class="btn gold" disabled=${submitting||!f.name.trim()} onClick=${()=>onSubmit(f)}>
            ${submitting?"Saving…":(submitLabel||"Save")}</button>
          ${onCancel && html`<button class="btn" onClick=${onCancel}>Cancel</button>`}
        </div>
      </div>`;
  }

  /* ---------- App ---------- */
  function App(){
    const [url,setUrl] = useState(()=>store.get(URL_KEY)||"");
    const api = useMemo(()=> url?makeApi(url):null, [url]);

    const [leads,setLeads] = useState([]);
    const [loading,setLoading] = useState(false);
    const [loadErr,setLoadErr] = useState("");
    const [tab,setTab] = useState("overview");

    const [search,setSearch] = useState("");
    const [fSource,setFSource] = useState("");
    const [fStatus,setFStatus] = useState("");

    const [editing,setEditing] = useState(null);   // lead being edited (drawer)
    const [savingEdit,setSavingEdit] = useState(false);
    const [addSaving,setAddSaving] = useState(false);

    const [delTarget,setDelTarget] = useState(null); // delete modal
    const [deleting,setDeleting] = useState(false);

    const [logTarget,setLogTarget] = useState(null); // log modal
    const [toasts,setToasts] = useState([]);
    const toastId = useRef(0);

    const toast = useCallback((msg,type)=>{
      const id = ++toastId.current;
      setToasts(t=>[...t,{id,msg,type}]);
      setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2600);
    },[]);

    const load = useCallback(async ()=>{
      if(!api) return;
      setLoading(true); setLoadErr("");
      try{ setLeads(await api.get()); }
      catch(e){ setLoadErr("Couldn't load leads. Your Sheet may be waking up. Tap Sync to retry."); }
      finally{ setLoading(false); }
    },[api]);

    useEffect(()=>{ if(api) load(); },[api,load]);

    const connect = (u)=>{ store.set(URL_KEY,u); setUrl(u); };
    const disconnect = ()=>{ store.del(URL_KEY); setUrl(""); setLeads([]); };

    /* ----- CRUD handlers ----- */
    const doAdd = async (lead)=>{
      setAddSaving(true);
      const optimistic = {...lead, id: lead.id || ("tmp-"+Date.now())};
      try{
        await api.add(lead);
        toast("Lead added","good");
        setTab("leads");
        await load();
      }catch(e){ toast("Couldn't add lead. Try again.","bad"); }
      finally{ setAddSaving(false); }
    };

    const doUpdate = async (lead)=>{
      setSavingEdit(true);
      const prev = leads;
      setLeads(ls=>ls.map(l=>l.id===lead.id?lead:l)); // optimistic
      try{
        await api.update(lead);
        toast("Changes saved","good");
        setEditing(null);
      }catch(e){ setLeads(prev); toast("Couldn't save changes. Try again.","bad"); }
      finally{ setSavingEdit(false); }
    };

    const doDelete = async ()=>{
      if(!delTarget) return;
      setDeleting(true);
      const prev = leads;
      try{
        await api.remove(delTarget.id);
        setLeads(ls=>ls.filter(l=>l.id!==delTarget.id)); // remove only on confirmed success
        setDelTarget(null);
        toast("Lead deleted","good");
      }catch(e){
        setLeads(prev);
        toast("Couldn't delete. Try again.","bad");
      }finally{ setDeleting(false); }
    };

    const doLog = async (kind,outcome,text)=>{
      if(!logTarget) return;
      try{
        await api.log(logTarget.id, kind, outcome, text);
        toast("Interaction logged","good");
        setLogTarget(null);
        load(); // refresh notes/last-touch
      }catch(e){ toast("Couldn't log that. Try again.","bad"); }
    };

    /* ----- derived data ----- */
    const filtered = useMemo(()=>{
      const q = search.trim().toLowerCase();
      return leads.filter(l=>{
        if(fSource && l.source!==fSource) return false;
        if(fStatus && l.status!==fStatus) return false;
        if(q){ const hay=(l.name+" "+l.email+" "+l.phone+" "+l.notes).toLowerCase(); if(!hay.includes(q)) return false; }
        return true;
      });
    },[leads,search,fSource,fStatus]);

    const stats = useMemo(()=>{
      const now = new Date(), thisMonth = monthKey(now);
      let pipeVal=0, totalComm=0, closedThisMonth=0, daysArr=[];
      leads.forEach(l=>{
        if(!WON_STATUSES.includes(l.status)) pipeVal += num(l.dealValue);
        if(WON_STATUSES.includes(l.status)) totalComm += num(l.commissionAmount);
        const dc = parseDate(l.dateClosed);
        if(dc && monthKey(dc)===thisMonth) closedThisMonth++;
        const dd = daysBetween(l.dateAdded,l.dateClosed);
        if(dd!=null && dd>=0) daysArr.push(dd);
      });
      const active = leads.filter(l=>OPEN_STATUSES.includes(l.status)).length;
      const avgDays = daysArr.length ? Math.round(daysArr.reduce((a,b)=>a+b,0)/daysArr.length) : null;
      return {total:leads.length, active, closedThisMonth, pipeVal, totalComm, avgDays};
    },[leads]);

    const byStatus = useMemo(()=>STATUSES.map(s=>({label:s,value:leads.filter(l=>l.status===s).length})).filter(r=>r.value>0),[leads]);
    const bySource = useMemo(()=>SOURCES.map(s=>({label:s,value:leads.filter(l=>l.source===s).length})).filter(r=>r.value>0),[leads]);
    const byMonth = useMemo(()=>{
      const now=new Date(), keys=[];
      for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); keys.push(monthKey(d)); }
      const counts = Object.fromEntries(keys.map(k=>[k,0]));
      leads.forEach(l=>{ const d=parseDate(l.dateAdded); if(d){ const k=monthKey(d); if(k in counts) counts[k]++; } });
      return keys.map(k=>({label:monthLabel(k),value:counts[k]}));
    },[leads]);

    const sourcePerf = useMemo(()=>SOURCES.map(s=>{
      const rows = leads.filter(l=>l.source===s);
      const closed = rows.filter(l=>WON_STATUSES.includes(l.status));
      const comm = closed.reduce((a,l)=>a+num(l.commissionAmount),0);
      const closeDays = rows.map(l=>daysBetween(l.dateAdded,l.dateClosed)).filter(d=>d!=null&&d>=0);
      const avgClose = closeDays.length?Math.round(closeDays.reduce((a,b)=>a+b,0)/closeDays.length):null;
      return {source:s, leads:rows.length, closed:closed.length,
              rate: rows.length?Math.round(closed.length/rows.length*100):0,
              comm, perLead: rows.length?Math.round(comm/rows.length):0, avgClose};
    }).filter(r=>r.leads>0),[leads]);

    /* ----- render gates ----- */
    if(!url) return html`<${Connect} onConnect=${connect} />`;

    return html`
      <div>
        <header class="top">
          <div class="top-in">
            <div class="brand"><div class="dot">R</div><div>Rivertown Lead Tracker<small>Live from your Google Sheet</small></div></div>
            <div class="top-actions">
              <div class="status-pill"><i></i> Connected</div>
              <button class="btn ghost sm" onClick=${load} disabled=${loading}>${loading?"Syncing…":"Sync"}</button>
              <button class="btn ghost sm" onClick=${disconnect}>Disconnect</button>
            </div>
          </div>
          <div class="tabsbar">
            <nav class="tabs">
              ${[["overview","Overview"],["add","Add Lead"],["leads","Leads"],["analytics","Analytics"]].map(([k,lab])=>html`
                <button key=${k} class=${tab===k?"active":""} onClick=${()=>setTab(k)}>${lab}</button>`)}
            </nav>
          </div>
        </header>

        <div class="wrap">
          ${loadErr && html`<div class="err-banner">${loadErr}
              <button class="btn sm" style="margin-left:auto" onClick=${load}>Retry</button></div>`}

          ${tab==="overview" && html`<${Overview} stats=${stats} byStatus=${byStatus} bySource=${bySource} byMonth=${byMonth} loading=${loading} count=${leads.length} />`}

          ${tab==="add" && html`
            <h2 class="sec">Add a lead</h2>
            <div class="panel">
              <${LeadForm} onSubmit=${doAdd} submitting=${addSaving} submitLabel="Add lead" />
            </div>`}

          ${tab==="leads" && html`<${LeadsTab}
              leads=${filtered} total=${leads.length} loading=${loading}
              search=${search} setSearch=${setSearch}
              fSource=${fSource} setFSource=${setFSource} fStatus=${fStatus} setFStatus=${setFStatus}
              onEdit=${setEditing} onDelete=${setDelTarget} onLog=${setLogTarget} />`}

          ${tab==="analytics" && html`<${Analytics} rows=${sourcePerf} />`}
        </div>

        ${editing && html`
          <div class="drawer-bg" onClick=${e=>{ if(e.target.className==="drawer-bg") setEditing(null); }}>
            <div class="drawer">
              <div class="drawer-head"><b>Edit lead</b>
                <span class="muted" style="color:#9fb0cc;font-weight:500">${editing.name}</span>
                <button class="x" onClick=${()=>setEditing(null)}>×</button></div>
              <div class="drawer-body">
                <${LeadForm} initial=${editing} onSubmit=${doUpdate} onCancel=${()=>setEditing(null)}
                    submitting=${savingEdit} submitLabel="Save changes" />
              </div>
            </div>
          </div>`}

        ${delTarget && html`<${DeleteModal} lead=${delTarget} deleting=${deleting}
            onCancel=${()=>!deleting&&setDelTarget(null)} onConfirm=${doDelete} />`}

        ${logTarget && html`<${LogModal} lead=${logTarget} onCancel=${()=>setLogTarget(null)} onSubmit=${doLog} />`}

        <${Toasts} items=${toasts} />
      </div>`;
  }

  /* ---------- Overview tab ---------- */
  function Overview({stats,byStatus,bySource,byMonth,loading,count}){
    if(loading && !count) return html`<div class="spin"></div>`;
    const K = (lab,val,sub)=>html`<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div>${sub&&html`<div class="sub">${sub}</div>`}</div>`;
    return html`
      <div>
        <div class="kpis">
          ${K("Total leads", stats.total)}
          ${K("Active pipeline", stats.active, "open leads")}
          ${K("Closed this month", stats.closedThisMonth)}
          ${K("Pipeline value", fmt$(stats.pipeVal), "open deals")}
          ${K("Total commission", fmt$(stats.totalComm), "won deals")}
          ${K("Avg days to close", stats.avgDays==null?"—":stats.avgDays)}
        </div>
        <div class="cards2">
          <div class="panel"><h3>Pipeline by status</h3><${BarChart} rows=${byStatus} /></div>
          <div class="panel"><h3>Leads by source</h3><${BarChart} rows=${bySource} /></div>
        </div>
        <div class="panel" style="margin-top:14px"><h3>Monthly lead volume (last 6 months)</h3><${BarChart} rows=${byMonth} /></div>
      </div>`;
  }

  /* ---------- Leads tab ---------- */
  function LeadsTab({leads,total,loading,search,setSearch,fSource,setFSource,fStatus,setFStatus,onEdit,onDelete,onLog}){
    return html`
      <div>
        <h2 class="sec">Leads <span class="muted" style="font-weight:500;font-size:13px">· ${leads.length} of ${total}</span></h2>
        <div class="controls">
          <input type="text" placeholder="Search name, email, phone, notes…" value=${search} onInput=${e=>setSearch(e.target.value)} />
          <select value=${fSource} onChange=${e=>setFSource(e.target.value)}>
            <option value="">All sources</option>${SOURCES.map(s=>html`<option key=${s} value=${s}>${s}</option>`)}</select>
          <select value=${fStatus} onChange=${e=>setFStatus(e.target.value)}>
            <option value="">All statuses</option>${STATUSES.map(s=>html`<option key=${s} value=${s}>${s}</option>`)}</select>
        </div>
        ${loading && !total ? html`<div class="spin"></div>` : html`
        <div class="tablewrap">
          <table>
            <thead><tr>
              <th>Name</th><th>Source</th><th>Status</th><th>System</th><th>Deal</th><th>Commission</th><th>Added</th><th>Days</th><th></th>
            </tr></thead>
            <tbody>
              ${leads.length===0 ? html`<tr><td colspan="9"><div class="empty">No leads match. Adjust filters or add one.</div></td></tr>` :
              leads.map(l=>{
                const days = daysBetween(l.dateAdded, l.dateClosed);
                return html`<tr key=${l.id}>
                  <td><div class="who">${l.name||"—"}</div><div class="sub">${l.email||l.phone||""}</div></td>
                  <td>${l.source||"—"}</td>
                  <td><span class=${"chip "+stClass(l.status)}>${l.status||"—"}</span></td>
                  <td>${l.systemSize?num(l.systemSize)+" kW":"—"}</td>
                  <td>${num(l.dealValue)?fmt$(num(l.dealValue)):"—"}</td>
                  <td>${num(l.commissionAmount)?fmt$(num(l.commissionAmount)):"—"}</td>
                  <td>${l.dateAdded||"—"}</td>
                  <td>${days==null?"—":days}</td>
                  <td><div class="rowbtns">
                    <button class="iconbtn" title="Log interaction" onClick=${()=>onLog(l)}>Log</button>
                    <button class="iconbtn" title="Edit" onClick=${()=>onEdit(l)}>Edit</button>
                    <button class="iconbtn del" title="Delete" onClick=${()=>onDelete(l)}>Delete</button>
                  </div></td>
                </tr>`;
              })}
            </tbody>
          </table>
        </div>`}
      </div>`;
  }

  /* ---------- Analytics tab ---------- */
  function Analytics({rows}){
    const closeRows = rows.filter(r=>r.avgClose!=null).map(r=>({label:r.source,value:r.avgClose,display:r.avgClose+"d"}));
    return html`
      <div>
        <h2 class="sec">Analytics</h2>
        <div class="panel"><h3>Avg days to close by source</h3><${BarChart} rows=${closeRows} /></div>
        <div class="panel" style="margin-top:14px">
          <h3>Source performance</h3>
          <div class="tablewrap" style="box-shadow:none;border:none">
            <table>
              <thead><tr><th>Source</th><th>Leads</th><th>Closed</th><th>Close rate</th><th>Commission</th><th>Per lead</th></tr></thead>
              <tbody>
                ${rows.length===0?html`<tr><td colspan="6"><div class="empty">No data yet.</div></td></tr>`:
                rows.map(r=>html`<tr key=${r.source}>
                  <td><b>${r.source}</b></td><td>${r.leads}</td><td>${r.closed}</td>
                  <td><div style="display:flex;align-items:center;gap:8px">
                    <div class="bar-track" style="width:70px"><div class="bar-fill" style=${{width:r.rate+"%"}}></div></div>${r.rate}%</div></td>
                  <td>${fmt$(r.comm)}</td><td>${fmt$(r.perLead)}</td>
                </tr>`)}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;
  }

  /* ---------- Delete confirmation modal ---------- */
  function DeleteModal({lead,deleting,onCancel,onConfirm}){
    return html`
      <div class="modal-bg" onClick=${e=>{ if(e.target.className==="modal-bg") onCancel(); }}>
        <div class="modal">
          <div class="warnring">!</div>
          <h3>Delete this lead?</h3>
          <p><b>${lead.name||"This lead"}</b>${lead.email?` (${lead.email})`:""} will be removed from your Sheet. This can't be undone.</p>
          <div class="modal-actions">
            <button class="btn" disabled=${deleting} onClick=${onCancel}>Cancel</button>
            <button class="btn danger" disabled=${deleting} onClick=${onConfirm}>${deleting?"Deleting…":"Delete lead"}</button>
          </div>
        </div>
      </div>`;
  }

  /* ---------- Log interaction modal ---------- */
  function LogModal({lead,onCancel,onSubmit}){
    const [kind,setKind] = useState(LOG_KINDS[0]);
    const [outcome,setOutcome] = useState(LOG_OUTCOMES[0]);
    const [text,setText] = useState("");
    const [busy,setBusy] = useState(false);
    const go = async ()=>{ setBusy(true); await onSubmit(kind,outcome,text); setBusy(false); };
    return html`
      <div class="modal-bg" onClick=${e=>{ if(e.target.className==="modal-bg"&&!busy) onCancel(); }}>
        <div class="modal" style="max-width:440px">
          <h3>Log interaction</h3>
          <p style="margin-bottom:14px">${lead.name}</p>
          <div class="formgrid">
            <div class="field"><label>Type</label>
              <select value=${kind} onChange=${e=>setKind(e.target.value)}>${LOG_KINDS.map(k=>html`<option key=${k}>${k}</option>`)}</select></div>
            <div class="field"><label>Outcome</label>
              <select value=${outcome} onChange=${e=>setOutcome(e.target.value)}>${LOG_OUTCOMES.map(o=>html`<option key=${o}>${o}</option>`)}</select></div>
          </div>
          <div class="field" style="margin-top:12px"><label>Note</label>
            <textarea value=${text} onInput=${e=>setText(e.target.value)} placeholder="What happened, next step…"></textarea></div>
          <div class="modal-actions" style="margin-top:16px">
            <button class="btn" disabled=${busy} onClick=${onCancel}>Cancel</button>
            <button class="btn gold" disabled=${busy} onClick=${go}>${busy?"Saving…":"Save log"}</button>
          </div>
        </div>
      </div>`;
  }

  render(html`<${App} />`, document.getElementById("root"));
})();
</script>
</body>
</html>
